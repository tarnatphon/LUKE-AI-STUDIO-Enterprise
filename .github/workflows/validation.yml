name: validation

# The suites in scripts/validation/ used to run by hand, one file at a time
# (139 of them). run-all.cjs runs the lot and fails the build on anything that
# is not already recorded in scripts/validation/ci-baseline.json.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: validation suites
    # Node 22 is what the baseline (see ci-baseline.json) was measured on.
    # Pinned rather than ubuntu-latest: GitHub moves that label to Ubuntu 26
    # on 2026-10-19, and a runner that changes under a passing suite turns a
    # green build red without anyone touching the code. 24.04 is what
    # ubuntu-latest points at today, so pinning it changes nothing now.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      # Every action here is on the major that runs on Node 24. The v4/v5
      # versions target Node 20, which the runners no longer carry, so every
      # run has been ending in a deprecation warning.
      - uses: actions/checkout@v7
        with:
          # Several suites read git history to prove something is not tracked
          # (test-releases-untracked, test-runtime-state-not-in-git,
          # test-mac-launch-files-tracked), and a shallow clone answers
          # differently from a full one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The suites require serve.cjs, which needs scripts/server's dependencies
      # (@aws-sdk/*, jszip, ...). Without them the run dies with MODULE_NOT_FOUND.
      # validate-release.sh runs the Image-to-Video Duration Worker checks
      # through a Python that can import imageio_ffmpeg, and stops the whole
      # script when no such interpreter is on the machine. GitHub's runner has
      # Python but not that module, so without this step the release contract is
      # only ever half-checked here.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation Python dependencies
        run: pip install --disable-pip-version-check imageio-ffmpeg

      - name: Install server dependencies
        run: npm ci
        working-directory: scripts/server

      # eslint lives in app/frontend's devDependencies, and the frontend build
      # is what produces app/dist — several suites boot the server and ask it for
      # "/" (test-api-cors-policy, test-static-file-containment) or read the
      # bundle (test-frontend-bundle-budgets).
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend

      - name: Build frontend
        run: npm run build
        working-directory: app/frontend

      - name: Run validation suites
        run: node scripts/validation/run-all.cjs --timeout 300

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-reports/
          if-no-files-found: warn
          retention-days: 14
